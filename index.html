<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доброе утро ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    img {
      max-width: 100%;
      max-height: 65vh;
      border-radius: 16px;
      object-fit: contain;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    #wish {
      font-size: 22px;
      line-height: 1.4;
      font-weight: 500;
      max-width: 500px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <img id="pic" src="" alt="Доброе утро">
  <div id="wish"></div>

  <script>
    const images = Array.from({ length: 10 }, (_, i) => `${i + 1}.jpg`);

    const regularWishes = [
      "Доброе утро, солнце! Пусть этот день будет таким же тёплым, как ты ❤️",
      "С просыпанием! Желаю, чтобы сегодня все дела складывались легко, а задачи решались сами собой.",
      "Просыпайся с улыбкой! Сегодня тебя ждёт отличный день, я в тебя верю",
      "Доброе утро! Напоминание на сегодня: ты самая прекрасная ❤️",
      "Тебе выпала пасхалка это редкое и секретное приветсвтие с утра поэтому тебе сегодня точно повезет"
    ];

    const poems = [
      "Мороз и солнце; день чудесный!\nЕще ты дремлешь, друг прелестный —\nПора, красавица, проснись:\nОткрой сомкнуты негой взоры.",
      "Ночь, улица, фонарь, аптека,\nБессмысленный и тусклый свет.\nЖиви еще хоть четверть века —\nВсе будет так. Исхода нет.",
      "Белеет парус одинокий\nВ тумане моря голубом!..\nЧто ищет он в стране далекой?\nЧто кинул он в краю родном?..",
      "Я помню чудное мгновенье:\nПередо мной явилась ты,\nКак мимолетное виденье,\nКак гений чистой красоты.",
      "Умом Россию не понять,\nАршином общим не измерить:\nУ ней особенная стать —\nВ Россию можно только верить.",
      "Не привыкайте никогда к любви!\nРазменивать ее не смейте на привычку,\nСловно бумажник, износившийся в пыли,\nИли наскучившую за день электричку.",
      "Я вас любил: любовь еще, быть может,\nВ душе моей угасла не совсем;\nНо пусть она вас больше не тревожит;\nЯ не хочу печалить вас ничем.",
      "Любить иных — тяжелый крест,\nА ты прекрасна без извилин,\nИ прелести твоей секрет\nРазгадке жизни равносилен.",
      "Послушайте!\nВедь, если звезды зажигают —\nзначит — это кому-нибудь нужно?\nЗначит — кто-то хочет, чтобы они были?",
      "Под ним струя светлей лазури,\nНад ним луч солнца золотой…\nА он, мятежный, просит бури,\nКак будто в бурях есть покой!"
    ];

    const formattedPoems = poems.map(poem => `Доброе утро ❤️ вот твой стих сегодня:\n\n${poem}`);
    const wishes = [...regularWishes, ...formattedPoems];

    // Функция выбора элемента без повторов до конца цикла
    function getNextUniqueItem(items, storageKey) {
      let remaining = JSON.parse(localStorage.getItem(storageKey)) || [];
      
      // Оставляем только актуальные элементы (если список изменился)
      remaining = remaining.filter(item => items.includes(item));

      // Если всё уже было показано — начинаем новый цикл
      if (remaining.length === 0) {
        remaining = [...items];
      }

      const randomIndex = Math.floor(Math.random() * remaining.length);
      const selectedItem = remaining.splice(randomIndex, 1)[0];

      localStorage.setItem(storageKey, JSON.stringify(remaining));
      return selectedItem;
    }

    const randomImg = getNextUniqueItem(images, 'morning_used_images');
    const randomWish = getNextUniqueItem(wishes, 'morning_used_wishes');

    document.getElementById('pic').src = encodeURI(randomImg);
    document.getElementById('wish').textContent = randomWish;
  </script>
</body>
</html>
